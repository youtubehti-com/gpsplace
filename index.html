<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الملاحة العالمي - نسخة العمل النهائية</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        :root{ --bg:#0f172a; --card:rgba(30,41,59,.8); --primary:#0d9488; --accent:#f59e0b; --gps:#2563eb; --text:#ffffff; --danger:#ef4444; --success:#10b981; --lost:#7c3aed; }
        *{ margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,sans-serif; }
        body{ background:var(--bg); color:var(--text); min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; }
        .container{ width:100%; max-width:600px; background:var(--card); backdrop-filter:blur(10px); border-radius:25px; padding:20px; box-shadow:0 20px 50px rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,0.1); }
        h1{ text-align:center; color:var(--primary); margin-bottom:15px; font-size:1.5rem; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        button{ width:100%; padding:13px; border:none; border-radius:14px; font-weight:bold; cursor:pointer; transition:.3s; }
        button:hover{ transform:translateY(-2px); filter: brightness(1.2); }
        .gps-btn{ background:var(--gps); color:white; }
        .stop-btn{ background:var(--danger); color:white; }
        .search-btn{ background:var(--accent); color:#000; grid-column: span 2; }
        .maps-btn{ background:var(--primary); color:white; width: 100%; margin-top: 15px; padding: 15px; font-size: 1.1rem; }
        .share-btn{ background:var(--success); color:white; grid-column: span 2; margin: 10px 0; }
        .lost-section { border: 2px dashed var(--lost); padding: 15px; border-radius: 20px; margin-bottom: 15px; background: rgba(124, 58, 237, 0.1); }
        #map{ width:100%; height:350px; border-radius:15px; margin-top:15px; border: 2px solid #334155; }
        .distance-container { text-align:center; background: #1e293b; padding: 15px; border-radius: 15px; margin-top: 15px; }
        .distance{ font-size: 2rem; color:var(--success); font-weight:bold; }
        input, select { width:100%; padding:12px; border-radius:10px; background:#0f172a; color:white; border: 1px solid #334155; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛰️ نظام الملاحة المطور</h1>
        <div class="btn-grid">
            <button class="gps-btn" onclick="startTracking()">📍 تشغيل الموقع</button>
            <button class="stop-btn" onclick="stopTracking()">⛔ إيقاف</button>
        </div>
        
        <div class="lost-section">
            <h3 style="color:#c084fc; text-align:center; margin-bottom:10px;">نظام الطوارئ (أنا تائه)</h3>
            <div class="btn-grid">
                <button style="background:#475569; color:white;" onclick="saveLocation()">💾 حفظ موقعي الحالي</button>
                <button class="lost-btn" style="background:var(--lost); color:white;" onclick="returnToStart()">🔄 العودة للمنطلق</button>
            </div>
            <select id="fenceDistance">
                <option value="0">إيقاف تنبيه الابتعاد</option>
                <option value="50">تنبيه عند ابتعاد 50م</option>
                <option value="100">تنبيه عند ابتعاد 100م</option>
            </select>
        </div>

        <input type="text" id="targetInput" placeholder="أدخل الوجهة (مثال: القاهرة، لندن...)">
        <button class="search-btn" onclick="searchDest()">🚀 تحليل وتحديد المسار</button>

        <div id="map"></div>
        <button class="share-btn" onclick="shareLoc()">🔗 مشاركة موقعي الحالي</button>
        
        <div class="distance-container">
            <div>المسافة الحالية:</div>
            <div class="distance" id="distBox">--</div>
        </div>
        <button class="maps-btn" onclick="openGMap()">🗺️ فتح المسار في Google Maps</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map = L.map('map').setView([30.0444, 31.2357], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        let userMarker, targetMarker, startCoords, watchId;

        function startTracking(){
            watchId = navigator.geolocation.watchPosition(pos => {
                let lat = pos.coords.latitude;
                let lng = pos.coords.longitude;
                if(!userMarker) userMarker = L.marker([lat, lng]).addTo(map).bindPopup("أنت هنا").openPopup();
                else userMarker.setLatLng([lat, lng]);
                map.setView([lat, lng], 14);
            });
        }

        function stopTracking(){ if(watchId) navigator.geolocation.clearWatch(watchId); }

        function saveLocation(){
            navigator.geolocation.getCurrentPosition(pos => {
                startCoords = [pos.coords.latitude, pos.coords.longitude];
                alert("تم حفظ موقع البدء: " + startCoords);
            });
        }

        function returnToStart(){
            if(!startCoords) return alert("لا يوجد موقع محفوظ!");
            [document.getElementById('targetInput').value] = [startCoords.join(',')];
            searchDest();
        }

        async function searchDest(){
            let query = document.getElementById('targetInput').value;
            let res = await fetch(`https://nominatim.openstreetmap.org/search?q=${query}&format=json`);
            let data = await res.json();
            if(data.length > 0){
                let lat = data[0].lat;
                let lon = data[0].lon;
                if(targetMarker) targetMarker.setLatLng([lat, lon]);
                else targetMarker = L.marker([lat, lon], {icon: new L.Icon.Default({iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png'})}).addTo(map);
                map.setView([lat, lon], 12);
                document.getElementById('distBox').innerText = "تم التحديد";
            }
        }

        function openGMap(){
            let target = document.getElementById('targetInput').value;
            window.open(`https://www.google.com/maps/search/?api=1&query=${target}`, '_blank');
        }

        function shareLoc(){
            navigator.geolocation.getCurrentPosition(pos => {
                let url = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                if(navigator.share) navigator.share({url: url});
                else prompt("انسخ الرابط:", url);
            });
        }
    </script>
</body>
</html>
