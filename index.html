<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملاح الذكي الكامل</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        :root{ --bg:#0f172a; --card:rgba(30,41,59,.9); --primary:#0d9488; --accent:#f59e0b; --danger:#ef4444; --success:#10b981; --lost:#8b5cf6; }
        body{ background:var(--bg); color:#fff; font-family:sans-serif; padding:15px; }
        .container{ max-width:600px; margin:auto; background:var(--card); padding:20px; border-radius:25px; box-shadow:0 10px 30px rgba(0,0,0,.5); }
        h1{ text-align:center; color:var(--primary); font-size:1.4rem; }
        input, select, button{ width:100%; padding:12px; margin:5px 0; border-radius:12px; border:none; font-size:1rem; }
        .btn-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        #map{ height:300px; border-radius:15px; margin:15px 0; }
        .alert-active { border: 2px solid var(--danger); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛰️ نظام الملاحة الذكي المتكامل</h1>
        
        <div class="btn-grid">
            <button style="background:var(--primary); color:white;" onclick="startLiveTracking()">📍 تشغيل الـ GPS</button>
            <button style="background:var(--danger); color:white;" onclick="stopTracking()">⛔ إيقاف</button>
        </div>

        <!-- قسم التنبيه الصوتي -->
        <div style="background:rgba(255,255,255,0.05); padding:15px; border-radius:15px; margin:10px 0;">
            <label>مسافة التنبيه (متر):</label>
            <input type="number" id="fenceDistance" value="50">
            <button id="alertToggleBtn" style="background:var(--lost); color:white;" onclick="toggleAlert()">📢 تفعيل التنبيه الصوتي: متوقف</button>
        </div>

        <div class="btn-grid">
            <button onclick="saveCurrentLocation()">💾 حفظ موقعي كبداية</button>
            <button onclick="returnToStartLocation()">🔄 العودة للبداية</button>
        </div>

        <input type="text" id="manualStartInput" placeholder="أدخل إحداثيات البداية يدوياً (lat,lng)">
        <button onclick="saveManualLocation()">تثبيت الموقع اليدوي</button>

        <input type="text" id="targetInput" placeholder="وجهتك (مثال: القاهرة)">
        <button style="background:var(--accent);" onclick="searchDestination()">🚀 بحث عن المسار</button>

        <div id="map"></div>
        <div id="distanceBox" style="text-align:center; font-size:1.5rem; color:var(--success);">0 متر</div>
        <button onclick="shareMyLocation()">🔗 مشاركة موقعي مع العائلة</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, userMarker, watchId, savedStartLat, savedStartLng, alertEnabled = false;
        
        function initMap(){ map = L.map('map').setView([0,0], 2); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); }
        
        function toggleAlert() {
            alertEnabled = !alertEnabled;
            let btn = document.getElementById("alertToggleBtn");
            btn.innerText = alertEnabled ? "📢 التنبيه الصوتي: مفعل" : "📢 التنبيه الصوتي: متوقف";
            btn.classList.toggle("alert-active", alertEnabled);
        }

        function speak(text) { window.speechSynthesis.cancel(); let msg = new SpeechSynthesisUtterance(text); msg.lang = 'ar-SA'; window.speechSynthesis.speak(msg); }

        function startLiveTracking(){
            watchId = navigator.geolocation.watchPosition(pos => {
                let {latitude, longitude} = pos.coords;
                if(!userMarker) userMarker = L.marker([latitude, longitude]).addTo(map);
                userMarker.setLatLng([latitude, longitude]);
                map.setView([latitude, longitude], 16);
                
                if(savedStartLat && alertEnabled) checkDistance(latitude, longitude);
            }, null, {enableHighAccuracy: true});
        }

        function checkDistance(lat, lng) {
            let threshold = document.getElementById("fenceDistance").value;
            let dist = getDistance(lat, lng, savedStartLat, savedStartLng);
            document.getElementById("distanceBox").innerText = Math.round(dist) + " متر";
            
            if(dist > threshold) {
                let dir = getDirection(lat, lng, savedStartLat, savedStartLng);
                speak("تحذير! لقد ابتعدت. اتجه نحو " + dir);
            }
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            let dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
            let a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function getDirection(lat1, lon1, lat2, lon2) {
            let y = Math.sin(lon2-lon1) * Math.cos(lat2);
            let x = Math.cos(lat1)*Math.sin(lat2) - Math.sin(lat1)*Math.cos(lat2)*Math.cos(lon2-lon1);
            let brng = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
            if(brng < 22.5 || brng >= 337.5) return "الشمال";
            if(brng < 67.5) return "الشمال الشرقي";
            if(brng < 112.5) return "الشرق";
            if(brng < 157.5) return "الجنوب الشرقي";
            if(brng < 202.5) return "الجنوب";
            if(brng < 247.5) return "الجنوب الغربي";
            if(brng < 292.5) return "الغرب";
            return "الشمال الغربي";
        }

        function saveCurrentLocation() { navigator.geolocation.getCurrentPosition(pos => { savedStartLat = pos.coords.latitude; savedStartLng = pos.coords.longitude; speak("تم حفظ الموقع."); }); }
        function saveManualLocation() { let coords = document.getElementById("manualStartInput").value.split(","); savedStartLat = parseFloat(coords[0]); savedStartLng = parseFloat(coords[1]); speak("تم التثبيت يدوياً."); }
        function stopTracking(){ navigator.geolocation.clearWatch(watchId); }
        async function searchDestination(){ /* الكود الأصلي للبحث */ }
        function shareMyLocation(){ let link = `https://www.google.com/maps?q=${savedStartLat},${savedStartLng}`; navigator.clipboard.writeText(link); alert("تم نسخ الرابط"); }
        
        window.onload = initMap;
    </script>
</body>
</html>
