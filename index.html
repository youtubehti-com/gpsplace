<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نظام التتبع العالمي الذكي - التحديث المستقر</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<!-- Routing Machine -->
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"/>

<style>

:root{
    --bg:#0f172a;
    --card:rgba(30,41,59,.8);
    --primary:#0d9488;
    --accent:#f59e0b;
    --gps:#2563eb;
    --text:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Tahoma,sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:550px;
    background:var(--card);
    backdrop-filter:blur(10px);
    border-radius:25px;
    padding:20px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
}

h1{
    text-align:center;
    color:var(--primary);
    margin-bottom:15px;
}

.status{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
    font-size:.9rem;
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#f59e0b;
}

.blink{
    animation:blink 1s infinite alternate;
}

@keyframes blink{
    from{opacity:.3;}
    to{opacity:1;}
}

.input-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:6px;
    color:var(--accent);
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#1e293b;
    color:white;
    font-size:1rem;
}

input:focus{
    outline:none;
    border:2px solid var(--primary);
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:14px;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
    margin-top:10px;
}

button:hover{
    transform:translateY(-2px);
}

.gps-btn{
    background:var(--gps);
    color:white;
}

.search-btn{
    background:var(--accent);
    color:#111827;
}

.maps-btn{
    background:var(--primary);
    color:white;
}

.stop-btn{
    background:#ef4444;
    color:white;
}

#map{
    width:100%;
    height:350px;
    margin-top:20px;
    border-radius:18px;
    overflow:hidden;
}

.card{
    background:rgba(15,23,42,.8);
    padding:15px;
    border-radius:18px;
    margin-top:15px;
}

.card h3{
    color:var(--accent);
    margin-bottom:10px;
}

.distance{
    text-align:center;
    font-size:2rem;
    color:#10b981;
    font-weight:bold;
}

.small{
    font-size:.8rem;
    opacity:.8;
    margin-top:5px;
}

/* ستايل مخصص لخيار تثبيت الشاشة المتطور */
.toggle-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    background: #1e293b;
    padding: 10px 15px;
    border-radius: 12px;
}

</style>
</head>

<body>

<div class="container">

<h1>🛰️ المستكشف العالمي الذكي</h1>

<div class="status">
    <div class="dot" id="statusDot"></div>
    <span id="gpsStatus">في انتظار تشغيل GPS أو تحديد وجهة...</span>
</div>

<button class="gps-btn" onclick="startLiveTracking()">
📍 تشغيل التتبع المباشر عالي الدقة GPS
</button>

<div class="toggle-container">
    <span>🔒 تثبيت الشاشة وتتبع حركتي تلقائياً</span>
    <input type="checkbox" id="autoCenterCheck" checked style="width: auto; cursor: pointer;">
</div>

<button class="stop-btn" onclick="stopTracking()">
⛔ إيقاف التتبع
</button>

<div class="input-group">
    <label>الوجهة المطلوبة:</label>
    <input type="text" id="targetInput" placeholder="اكتب المكان أو المدينة">
</div>

<button class="search-btn" onclick="searchDestination()">
🚀 بدء الملاحة الذكية
</button>

<div id="map"></div>

<div class="card">
    <h3>📌 نقطة الانطلاق (أدق قراءة نشطة)</h3>
    <div id="startText">لم يتم تحديد الموقع بعد</div>
</div>

<div class="card">
    <h3>🎯 الوجهة</h3>
    <div id="targetText">لا توجد وجهة حالياً</div>
</div>

<div class="card">
    <h3 style="text-align:center;color:#10b981">
        📏 المسافة المتبقية (عبر الطرقات الفعليّة)
    </h3>

    <div class="distance" id="distanceBox">
        --
    </div>

    <div class="small" style="text-align:center" id="accuracyText">
        يتم تحديثها لحظياً بدقة طبقاً لمسار الشوارع الفعلي
    </div>
</div>

<button class="maps-btn" onclick="openGoogleMaps()">
🗺️ فتح الملاحة في خرائط جوجل
</button>

</div>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Routing -->
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

<script>

let map;
let userMarker;
let targetMarker;
let routeControl;
let watchId = null;

let currentLat = null;
let currentLng = null;

let targetLat = null;
let targetLng = null;

// استخدام أيقونات مميزة واحترافية تسهل رؤية الحركة في الخريطة الداخلية
const userIcon = L.icon({
    iconUrl: 'https://cdn-icons-png.flaticon.com/512/684/684908.png', 
    iconSize: [35, 35],
    iconAnchor: [17, 35]
});

const targetIcon = L.icon({
    iconUrl: 'https://cdn-icons-png.flaticon.com/512/252/252025.png', 
    iconSize: [35, 35],
    iconAnchor: [17, 35]
});

//////////////////////////////////////
// تشغيل الخريطة
//////////////////////////////////////

function initMap(){

    map = L.map('map').setView([26.8206,30.8025],6);

    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            attribution:'© OpenStreetMap contributors',
            maxZoom: 19
        }
    ).addTo(map);

}

//////////////////////////////////////
// تشغيل GPS المباشر عالي الدقة (مقتبس من التحديث الأخير)
//////////////////////////////////////

function startLiveTracking(){

    if(!navigator.geolocation){
        alert("المتصفح أو الجهاز لا يدعم مستشعر GPS");
        return;
    }

    if(watchId !== null) {
        return;
    }

    document.getElementById("statusDot").className = "dot blink";
    document.getElementById("statusDot").style.background = "#f59e0b";
    document.getElementById("gpsStatus").innerText =
        "جاري الاتصال بالأقمار الصناعية وتحسين الدقة...";

    // إعدادات الملاحة فائقة الدقة والسرعة لمنع التقييد والبطء
    const gpsOptions = {
        enableHighAccuracy: true, // تفعيل مستشعر الـ GPS الداخلي للهاتف بالكامل وليس شبكات التقريب
        maximumAge: 0,            // مسح الكاش واستلام قراءات حية فريش
        timeout: 4000             // تحديث سريع مستمر كل 4 ثوانٍ كحد أقصى
    };

    watchId = navigator.geolocation.watchPosition(

        function(position){

            // فلترة وتصفية دقة الإشارة (تجاهل القفزات الوهمية إذا كان معدل الخطأ أكثر من 30 متراً)
            if (position.coords.accuracy > 30 && currentLat !== null) {
                document.getElementById("accuracyText").innerText = `إشارة الـ GPS ضعيفة (نسبة الخطأ ±${Math.round(position.coords.accuracy)} متر)، يتم تحسين القراءة...`;
                return; 
            }

            currentLat = position.coords.latitude;
            currentLng = position.coords.longitude;

            document.getElementById("statusDot").classList.remove("blink");
            document.getElementById("statusDot").style.background =
                "#10b981";

            document.getElementById("gpsStatus").innerText =
                "نظام الملاحة نشط ومتصل بالقمر الصناعي 🛰️";

            document.getElementById("accuracyText").innerText = 
                `مستوى دقة الإشارة الحالي: ±${Math.round(position.coords.accuracy)} متر`;

            updateUserMarker();

            if(targetLat !== null && targetLng !== null){
                drawRoute();
            }

        },

        function(error){

            console.log(error);

            document.getElementById("statusDot").style.background =
                "#ef4444";
            document.getElementById("statusDot").classList.remove("blink");

            document.getElementById("gpsStatus").innerText =
                "فشل الوصول للموقع";

            alert(
                "تأكد من:\n\n1- السماح للموقع من إعدادات الهاتف والمستعرض\n2- تفعيل الـ GPS الفعلي\n3- استخدام رابط آمن HTTPS"
            );

        },
        gpsOptions
    );

}

//////////////////////////////////////
// إيقاف التتبع
//////////////////////////////////////

function stopTracking(){

    if(watchId !== null){

        navigator.geolocation.clearWatch(watchId);

        watchId = null;

        document.getElementById("gpsStatus").innerText =
            "تم إيقاف الملاحة النشطة";

        document.getElementById("statusDot").style.background =
            "#f59e0b";
        document.getElementById("statusDot").classList.remove("blink");

    }

}

//////////////////////////////////////
// تحديث ماركر المستخدم
//////////////////////////////////////

function updateUserMarker(){

    document.getElementById("startText").innerText =
        `خط العرض: ${currentLat.toFixed(6)}\nخط الطول: ${currentLng.toFixed(6)}`;

    if(userMarker){
        userMarker.setLatLng([currentLat,currentLng]);
    }else{
        userMarker = L.marker([currentLat,currentLng], {icon: userIcon})
            .addTo(map)
            .bindPopup("📍 موقعك الحالي الفعلي").openPopup();
    }

    // إدارة تثبيت الكاميرا والتحرك التلقائي مع السائق/المستخدم
    const isAutoCenter = document.getElementById("autoCenterCheck").checked;
    if(isAutoCenter && (targetLat === null || targetLng === null)) {
        map.setView([currentLat,currentLng],17); // زووم تتبع ملاحي مريح وقريب
    }

}

//////////////////////////////////////
// البحث عن الوجهة وتفعيل الـ GPS تلقائياً
//////////////////////////////////////

async function searchDestination(){

    let query =
        document.getElementById("targetInput").value.trim();

    if(!query){
        alert("اكتب اسم الوجهة");
        return;
    }

    try{

        let response = await fetch(
            `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`
        );

        let data = await response.json();

        if(data.length === 0){
            alert("لم يتم العثور على المكان، حاول صياغة الاسم بشكل أوضح");
            return;
        }

        targetLat = parseFloat(data[0].lat);
        targetLng = parseFloat(data[0].lon);

        let placeName = data[0].display_name;

        document.getElementById("targetText").innerText =
            placeName;

        updateTargetMarker();

        // تفعيل الـ GPS تلقائياً فور العثور على الهدف للبدء بالملاحة المباشرة
        startLiveTracking();

        if(currentLat !== null && currentLng !== null){
            drawRoute();
        }

    }catch(error){
        console.log(error);
        alert("حدث خطأ أثناء البحث عن الوجهة");
    }

}

//////////////////////////////////////
// تحديث ماركر الوجهة
//////////////////////////////////////

function updateTargetMarker(){

    if(targetMarker){
        targetMarker.setLatLng([targetLat,targetLng]);
    }else{
        targetMarker = L.marker([targetLat,targetLng], {icon: targetIcon})
            .addTo(map)
            .bindPopup("🎯 الوجهة المستهدفة");
    }

}

//////////////////////////////////////
// رسم ومتابعة الطريق الملاحي الحقيقي وحساب المسافة بدقة
//////////////////////////////////////

function drawRoute(){

    // إذا كان خط السير موجوداً، نغير الإحداثيات مباشرة بدلاً من حذفه وإعادة إنشائه لمنع حدوث وميض (Flickering)
    if(routeControl){
        routeControl.setWaypoints([
            L.latLng(currentLat,currentLng),
            L.latLng(targetLat,targetLng)
        ]);
    }else{
        routeControl = L.Routing.control({
            waypoints:[
                L.latLng(currentLat,currentLng),
                L.latLng(targetLat,targetLng)
            ],
            routeWhileDragging:false,
            draggableWaypoints:false,
            addWaypoints:false,
            show:false, // إخفاء لوحة التعليمات الجانبية للتركيز على الخريطة
            createMarker:function(){
                return null; // نعتمد على علاماتنا المخصصة الاحترافية المعرفة في الأعلى
            },
            lineOptions: {
                styles: [{ color: '#2563eb', opacity: 0.8, weight: 6 }] // خط مسار أزرق واضح يحاكي خرائط جوجل تماماً
            }
        }).addTo(map);

        // الاستماع لحدث العثور على المسار لاستخراج المسافة الحقيقية الدقيقة بالشوارع
        routeControl.on('routesfound', function(e) {
            let routes = e.routes;
            let summary = routes[0].summary;
            
            // المسافة المستلمة من الخادم تكون بالمتر الفعلي للطريق
            let distanceInMeters = summary.totalDistance; 
            updateDistanceDisplay(distanceInMeters);
        });
    }

    // إدارة حركة كاميرا الخريطة حسب رغبة المستخدم في التثبيت الصارم أو العرض الشامل للمسار
    const isAutoCenter = document.getElementById("autoCenterCheck").checked;
    if(!isAutoCenter) {
        let bounds = L.latLngBounds([
            [currentLat, currentLng],
            [targetLat, targetLng]
        ]);
        map.fitBounds(bounds, { padding: [50, 50] });
    } else {
        map.setView([currentLat, currentLng], 15); // ملاحقة دقيقة لموقعك الحالي مع إبقاء الزووم متزن ومناسب للطريق
    }

}

//////////////////////////////////////
// عرض المسافة المحدثة في واجهة المستخدم
//////////////////////////////////////

function updateDistanceDisplay(distance){

    if(distance >= 1000){
        document.getElementById("distanceBox").innerText =
            (distance/1000).toFixed(2) + " كم";
    }else{
        document.getElementById("distanceBox").innerText =
            Math.round(distance) + " متر";
    }

}

//////////////////////////////////////
// فتح خرائط جوجل الخارجية للملاحة الحية الموجهة بالصوت 100%
//////////////////////////////////////

function openGoogleMaps(){

    if(
        currentLat === null ||
        targetLat === null
    ){
        alert("حدد وجهتك وقم بتفعيل الـ GPS أولاً");
        return;
    }

    // رابط متطور يجبر الهواتف الذكية على فتح تطبيق خرائط جوجل الفعلي بوضع الملاحة الحية والقيادة مباشرة (Driving Mode)
    let url =
        `https://www.google.com/maps/dir/?api=1&origin=${currentLat},${currentLng}&destination=${targetLat},${targetLng}&travelmode=driving`;

    window.open(url,'_blank');

}

//////////////////////////////////////
// تشغيل الخريطة الأساسية عند البدء
//////////////////////////////////////

window.onload = initMap;

</script>

</body>
</html>
