<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نظام التتبع العالمي الذكي - المطور بمحرك جوجل</title>

<style>
:root{
    --bg:#0f172a;
    --card:rgba(30,41,59,.8);
    --primary:#0d9488;
    --accent:#f59e0b;
    --gps:#2563eb;
    --text:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Tahoma,sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:550px;
    background:var(--card);
    backdrop-filter:blur(10px);
    border-radius:25px;
    padding:20px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
}

h1{
    text-align:center;
    color:var(--primary);
    margin-bottom:15px;
}

.status{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
    font-size:.9rem;
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#f59e0b;
}

.blink{
    animation:blink 1s infinite alternate;
}

@keyframes blink{
    from{opacity:.3;}
    to{opacity:1;}
}

.input-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:6px;
    color:var(--accent);
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#1e293b;
    color:white;
    font-size:1rem;
}

input:focus{
    outline:none;
    border:2px solid var(--primary);
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:14px;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
    margin-top:10px;
}

button:hover{
    transform:translateY(-2px);
}

.gps-btn{
    background:var(--gps);
    color:white;
}

.search-btn{
    background:var(--accent);
    color:#111827;
}

.maps-btn{
    background:var(--primary);
    color:white;
}

.stop-btn{
    background:#ef4444;
    color:white;
}

#map{
    width:100%;
    height:350px;
    margin-top:20px;
    border-radius:18px;
    overflow:hidden;
}

.card{
    background:rgba(15,23,42,.8);
    padding:15px;
    border-radius:18px;
    margin-top:15px;
}

.card h3{
    color:var(--accent);
    margin-bottom:10px;
}

.distance{
    text-align:center;
    font-size:2rem;
    color:#10b981;
    font-weight:bold;
}

.small{
    font-size:.8rem;
    opacity:.8;
    margin-top:5px;
}

.toggle-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    background: #1e293b;
    padding: 10px 15px;
    border-radius: 12px;
}
</style>
</head>

<body>

<div class="container">

<h1>🛰️ المستكشف بمحرك Google</h1>

<div class="status">
    <div class="dot" id="statusDot"></div>
    <span id="gpsStatus">في انتظار تشغيل GPS أو تحديد وجهة...</span>
</div>

<button class="gps-btn" onclick="startLiveTracking()">
📍 تشغيل تتبع Google Maps المباشر
</button>

<div class="toggle-container">
    <span>🔒 تثبيت الشاشة والمتابعة التلقائية</span>
    <input type="checkbox" id="autoCenterCheck" checked style="width: auto; cursor: pointer;">
</div>

<button class="stop-btn" onclick="stopTracking()">
⛔ إيقاف التتبع
</button>

<div class="input-group">
    <label>الوجهة المطلوبة (بحث Google):</label>
    <!-- تم ربط هذا الحقل بميزة الإكمال التلقائي من جوجل -->
    <input type="text" id="targetInput" placeholder="اكتب المكان، الفندق أو المدينة">
</div>

<div id="map"></div>

<div class="card">
    <h3>📌 الإحداثيات الحالية (من المستشعر)</h3>
    <div id="startText">لم يتم تحديد الموقع بعد</div>
</div>

<div class="card">
    <h3>🎯 الوجهة المستهدفة</h3>
    <div id="targetText">لا توجد وجهة حالياً</div>
</div>

<div class="card">
    <h3 style="text-align:center;color:#10b981">
        📏 المسافة والوقت (حسب خوادم Google الحية)
    </h3>

    <div class="distance" id="distanceBox">
        --
    </div>

    <div class="small" style="text-align:center" id="accuracyText">
        مطابق تماماً لبيانات Google Maps الملاحية.
    </div>
</div>

<button class="maps-btn" onclick="openGoogleMaps()">
🗺️ فتح الملاحة في تطبيق خرائط جوجل
</button>

</div>

<!-- استدعاء مكتبة خرائط جوجل الرسمية مع تفعيل ميزة الأماكن والمسارات -->
<!-- تنبيه: يجب وضع الـ API Key الخاص بك مكان YOUR_API_KEY لتفعيل الخريطة بشكل كامل للجمهور -->
<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places&language=ar&region=EG"></script>

<script>
let map;
let userMarker;
let targetMarker;
let directionsService;
let directionsRenderer;
let autocomplete;
let watchId = null;

let currentLat = null;
let currentLng = null;
let targetLat = null;
let targetLng = null;

//////////////////////////////////////
// تهيئة خريطة جوجل الرسمية
//////////////////////////////////////
function initMap(){
    directionsService = new google.maps.DirectionsService();
    
    // إعداد واجهة رسم الطريق بشكل مخصص يشبه الملاحة الفلوية
    directionsRenderer = new google.maps.DirectionsRenderer({
        suppressMarkers: true, // إخفاء علامات جوجل الافتراضية للتحكم بالماركرز الخاصة بنا
        polylineOptions: {
            strokeColor: "#2563eb",
            strokeOpacity: 0.8,
            strokeWeight: 6
        }
    });

    // إنشاء الخريطة
    map = new google.maps.Map(document.getElementById('map'), {
        center: { lat: 26.8206, lng: 30.8025 },
        zoom: 6,
        disableDefaultUI: false,
        // ستايل ليلي عصري متناسق مع تصميمك
        styles: [
            { elementType: "geometry", stylers: [{ color: "#0f172a" }] },
            { elementType: "labels.text.fill", stylers: [{ color: "#94a3b8" }] },
            { featureType: "road", elementType: "geometry", stylers: [{ color: "#1e293b" }] },
            { featureType: "road", elementType: "geometry.stroke", stylers: [{ color: "#334155" }] },
            { featureType: "water", elementType: "geometry", stylers: [{ color: "#1e1b4b" }] }
        ]
    });

    directionsRenderer.setMap(map);

    // تفعيل ميزة الإكمال التلقائي الذكية من جوجل بمجرد الكتابة في الحقل
    const input = document.getElementById("targetInput");
    autocomplete = new google.maps.places.Autocomplete(input);
    autocomplete.bindTo("bounds", map);

    // الاستماع لاختيار المستخدم للمكان من اقتراحات جوجل
    autocomplete.addListener("place_changed", () => {
        const place = autocomplete.getPlace();
        if (!place.geometry || !place.geometry.location) {
            alert("يرجى اختيار مكان من القائمة المنسدلة المتاحة");
            return;
        }

        targetLat = place.geometry.location.lat();
        targetLng = place.geometry.location.lng();
        document.getElementById("targetText").innerText = place.formatted_address || place.name;

        updateTargetMarker();
        startLiveTracking(); // تفعيل الملاحة فوراً

        if (currentLat !== null && currentLng !== null) {
            drawRoute();
        }
    });
}

//////////////////////////////////////
// تشغيل الـ GPS المباشر فائق الدقة
//////////////////////////////////////
function startLiveTracking(){
    if(!navigator.geolocation){
        alert("الجهاز لا يدعم مستشعر تحديد المواقع");
        return;
    }

    if(watchId !== null) return;

    document.getElementById("statusDot").className = "dot blink";
    document.getElementById("statusDot").style.background = "#f59e0b";
    document.getElementById("gpsStatus").innerText = "جاري الاتصال بالأقمار الصناعية وتحسين الدقة...";

    const gpsOptions = {
        enableHighAccuracy: true, 
        maximumAge: 0,            
        timeout: 4000             
    };

    watchId = navigator.geolocation.watchPosition(
        function(position){
            // تصفية الإشارات الضعيفة للحفاظ على اتزان الخريطة
            if (position.coords.accuracy > 30 && currentLat !== null) {
                document.getElementById("accuracyText").innerText = `إشارة الـ GPS غير مستقرة، يتم موازنتها...`;
                return; 
            }

            currentLat = position.coords.latitude;
            currentLng = position.coords.longitude;

            document.getElementById("statusDot").classList.remove("blink");
            document.getElementById("statusDot").style.background = "#10b981";
            document.getElementById("gpsStatus").innerText = "نظام ملاحة جوجل نشط ومتصل 🛰️";
            document.getElementById("accuracyText").innerText = `مستوى دقة إشارة الهاتف: ±${Math.round(position.coords.accuracy)} متر`;

            updateUserMarker();

            if(targetLat !== null && targetLng !== null){
                drawRoute();
            }
        },
        function(error){
            console.error(error);
            document.getElementById("statusDot").style.background = "#ef4444";
            document.getElementById("gpsStatus").innerText = "فشل الوصول للـ GPS";
        },
        gpsOptions
    );
}

function stopTracking(){
    if(watchId !== null){
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        document.getElementById("gpsStatus").innerText = "تم إيقاف التتبع النشط";
        document.getElementById("statusDot").style.background = "#f59e0b";
    }
}

//////////////////////////////////////
// تحديث موقعك بعلامة مخصصة متحركة
//////////////////////////////////////
function updateUserMarker(){
    const pos = { lat: currentLat, lng: currentLng };
    document.getElementById("startText").innerText = `${currentLat.toFixed(6)}, ${currentLng.toFixed(6)}`;

    if(userMarker){
        userMarker.setPosition(pos);
    } else {
        userMarker = new google.maps.Marker({
            position: pos,
            map: map,
            title: "موقعك الحالي",
            icon: {
                url: 'https://cdn-icons-png.flaticon.com/512/684/684908.png',
                scaledSize: new google.maps.Size(35, 35)
            }
        });
    }

    const isAutoCenter = document.getElementById("autoCenterCheck").checked;
    if(isAutoCenter && (targetLat === null || targetLng === null)) {
        map.setCenter(pos);
        map.setZoom(17);
    }
}

function updateTargetMarker(){
    const pos = { lat: targetLat, lng: targetLng };
    if(targetMarker){
        targetMarker.setPosition(pos);
    } else {
        targetMarker = new google.maps.Marker({
            position: pos,
            map: map,
            title: "الوجهة",
            icon: {
                url: 'https://cdn-icons-png.flaticon.com/512/252/252025.png',
                scaledSize: new google.maps.Size(35, 35)
            }
        });
    }
}

//////////////////////////////////////
// حساب المسار الفعلي بواسطة خوارزمية Google المباشرة
//////////////////////////////////////
function drawRoute(){
    const origin = { lat: currentLat, lng: currentLng };
    const destination = { lat: targetLat, lng: targetLng };

    directionsService.route({
        origin: origin,
        destination: destination,
        travelMode: google.maps.TravelMode.DRIVING // حساب المسار بناءً على الشوارع المخصصة للسيارات
    }, (response, status) => {
        if (status === google.maps.DirectionsStatus.OK) {
            directionsRenderer.setDirections(response);
            
            // استخراج المسافة والوقت الفعلي بدقة متناهية من خوادم جوجل
            const route = response.routes[0].legs[0];
            const distanceText = route.distance.text; // مثل: "15.3 كم"
            const durationText = route.duration.text; // مثل: "22 دقيقة"

            document.getElementById("distanceBox").innerHTML = `${distanceText} <br><span style="font-size:1.2rem; color:#f59e0b;">⏳ الوقت المتوقع: ${durationText}</span>`;
            
            const isAutoCenter = document.getElementById("autoCenterCheck").checked;
            if (isAutoCenter) {
                map.setCenter(origin);
                map.setZoom(15);
            }
        } else {
            console.error("실패:" + status);
        }
    });
}

function openGoogleMaps(){
    if(currentLat === null || targetLat === null){
        alert("يرجى تحديد الموقع والوجهة أولاً");
        return;
    }
    let url = `https://www.google.com/maps/dir/?api=1&origin=${currentLat},${currentLng}&destination=${targetLat},${targetLng}&travelmode=driving`;
    window.open(url, '_blank');
}

// تشغيل الخريطة عند تحميل الصفحة
window.onload = initMap;
</script>

</body>
</html>
