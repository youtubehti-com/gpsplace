<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نظام التتبع العالمي الذكي - المطور</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<!-- Routing Machine -->
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"/>

<style>
:root{
    --bg:#0f172a;
    --card:rgba(30,41,59,.8);
    --primary:#0d9488;
    --accent:#f59e0b;
    --gps:#2563eb;
    --text:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Tahoma,sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:550px;
    background:var(--card);
    backdrop-filter:blur(10px);
    border-radius:25px;
    padding:20px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
}

h1{
    text-align:center;
    color:var(--primary);
    margin-bottom:15px;
}

.status{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
    font-size:.9rem;
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#f59e0b;
}

.blink{
    animation:blink 1s infinite alternate;
}

@keyframes blink{
    from{opacity:.3;}
    to{opacity:1;}
}

.input-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:6px;
    color:var(--accent);
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#1e293b;
    color:white;
    font-size:1rem;
}

input:focus{
    outline:none;
    border:2px solid var(--primary);
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:14px;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
    margin-top:10px;
}

button:hover{
    transform:translateY(-2px);
}

.gps-btn{
    background:var(--gps);
    color:white;
}

.search-btn{
    background:var(--accent);
    color:#111827;
}

.maps-btn{
    background:var(--primary);
    color:white;
}

.stop-btn{
    background:#ef4444;
    color:white;
}

#map{
    width:100%;
    height:350px;
    margin-top:20px;
    border-radius:18px;
    overflow:hidden;
}

.card{
    background:rgba(15,23,42,.8);
    padding:15px;
    border-radius:18px;
    margin-top:15px;
}

.card h3{
    color:var(--accent);
    margin-bottom:10px;
}

.distance{
    text-align:center;
    font-size:2rem;
    color:#10b981;
    font-weight:bold;
}

.small{
    font-size:.8rem;
    opacity:.8;
    margin-top:5px;
}

/* خيار تتبع الكاميرا المباشر */
.toggle-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    background: #1e293b;
    padding: 10px 15px;
    border-radius: 12px;
}
</style>
</head>

<body>

<div class="container">

<h1>🛰️ المستكشف العالمي الذكي</h1>

<div class="status">
    <div class="dot" id="statusDot"></div>
    <span id="gpsStatus">في انتظار تشغيل GPS أو تحديد وجهة...</span>
</div>

<button class="gps-btn" onclick="startLiveTracking()">
📍 تشغيل التتبع المباشر عالي الدقة GPS
</button>

<div class="toggle-container">
    <span>🔒 تثبيت الكاميرا وتتبع حركتي تلقائياً</span>
    <input type="checkbox" id="autoCenterCheck" checked style="width: auto; cursor: pointer;">
</div>

<button class="stop-btn" onclick="stopTracking()">
⛔ إيقاف التتبع
</button>

<div class="input-group">
    <label>الوجهة المطلوبة:</label>
    <input type="text" id="targetInput" placeholder="اكتب المكان أو المدينة">
</div>

<button class="search-btn" onclick="searchDestination()">
🚀 بدء الملاحة الذكية
</button>

<div id="map"></div>

<div class="card">
    <h3>📌 نقطة الانطلاق (أدق قراءة نشطة)</h3>
    <div id="startText">لم يتم تحديد الموقع بعد</div>
</div>

<div class="card">
    <h3>🎯 الوجهة</h3>
    <div id="targetText">لا توجد وجهة حالياً</div>
</div>

<div class="card">
    <h3 style="text-align:center;color:#10b981">
        📏 المسافة المتبقية (عبر الطرقات الفعلية)
    </h3>

    <div class="distance" id="distanceBox">
        --
    </div>

    <div class="small" style="text-align:center" id="accuracyText">
        يتم تحديثها لحظياً بدقة طبقاً لمسار الشوارع الفعلي
    </div>
</div>

<button class="maps-btn" onclick="openGoogleMaps()">
🗺️ فتح الملاحة في خرائط جوجل
</button>

</div>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Routing -->
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

<script>

let map;
let userMarker;
let targetMarker;
let routeControl;
let watchId = null;

let currentLat = null;
let currentLng = null;

let targetLat = null;
let targetLng = null;

// أيقونات مخصصة لتبدو احترافية وواضحة
const userIcon = L.icon({
    iconUrl: 'https://cdn-icons-png.flaticon.com/512/684/684908.png', // أيقونة دبوس أزرق أو نقطة موقع
    iconSize: [35, 35],
    iconAnchor: [17, 35]
});

const targetIcon = L.icon({
    iconUrl: 'https://cdn-icons-png.flaticon.com/512/252/252025.png', // أيقونة هدف أحمر
    iconSize: [35, 35],
    iconAnchor: [17, 35]
});

//////////////////////////////////////
// تشغيل الخريطة الأساسية
//////////////////////////////////////
function initMap(){
    map = L.map('map').setView([26.8206,30.8025],6);

    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            attribution:'© OpenStreetMap contributors',
            maxZoom: 19
        }
    ).addTo(map);
}

//////////////////////////////////////
// تشغيل GPS المباشر فائق الدقة
//////////////////////////////////////
function startLiveTracking(){
    if(!navigator.geolocation){
        alert("المتصفح أو الجهاز لا يدعم مستشعر GPS");
        return;
    }

    if(watchId !== null) return;

    document.getElementById("statusDot").className = "dot blink";
    document.getElementById("statusDot").style.background = "#f59e0b";
    document.getElementById("gpsStatus").innerText = "جاري الاتصال بأقمار GPS وتحسين الدقة...";

    // إعدادات الملاحة الحية فائقة الدقة (مماثلة لخرائط جوجل)
    const gpsOptions = {
        enableHighAccuracy: true, // إجبار الجهاز على تشغيل الـ GPS الفعلي وليس التقريبي
        maximumAge: 0,            // عدم اعتماد أي قراءات قديمة مخزنة مؤقتاً
        timeout: 5000             // تحديث عالي السرعة كل 5 ثوانٍ كحد أقصى للاتصال
    };

    watchId = navigator.geolocation.watchPosition(
        function(position){
            // تصفية الإشارات العشوائية والمشوشة (إذا كانت نسبة الخطأ أكبر من 30 متر يتجاهلها مؤقتاً لثبات الكاميرا)
            if (position.coords.accuracy > 30 && currentLat !== null) {
                document.getElementById("accuracyText").innerText = `إشارة الـ GPS ضعيفة (نسبة الخطأ ${Math.round(position.coords.accuracy)} متر)، جاري تحسينها...`;
                return; 
            }

            currentLat = position.coords.latitude;
            currentLng = position.coords.longitude;

            document.getElementById("statusDot").classList.remove("blink");
            document.getElementById("statusDot").style.background = "#10b981";
            document.getElementById("gpsStatus").innerText = "نظام الملاحة نشط ومتصل بالقمر الصناعي 🛰️";
            document.getElementById("accuracyText").innerText = `مستوى دقة الإشارة الحالي: ±${Math.round(position.coords.accuracy)} متر`;

            updateUserMarker();

            // تحديث المسار فوراً في حالة وجود وجهة دون إعادة تحميل الخريطة
            if(targetLat !== null && targetLng !== null){
                drawRoute();
            }
        },
        function(error){
            console.error(error);
            document.getElementById("statusDot").style.background = "#ef4444";
            document.getElementById("statusDot").classList.remove("blink");
            document.getElementById("gpsStatus").innerText = "فشل الاتصال بالـ GPS";
            alert("يرجى التأكد من تفعيل صلاحيات الموقع، وتشغيل الـ GPS على الهاتف، واستخدام بروتوكول安全 HTTPS");
        },
        gpsOptions
    );
}

//////////////////////////////////////
// إيقاف التتبع
//////////////////////////////////////
function stopTracking(){
    if(watchId !== null){
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        document.getElementById("gpsStatus").innerText = "تم إيقاف الملاحة النشطة";
        document.getElementById("statusDot").style.background = "#f59e0b";
        document.getElementById("statusDot").classList.remove("blink");
    }
}

//////////////////////////////////////
// تحديث علامة المستخدم على الخريطة بشكل لحظي
//////////////////////////////////////
function updateUserMarker(){
    document.getElementById("startText").innerText = `خط العرض: ${currentLat.toFixed(6)} \n خط الطول: ${currentLng.toFixed(6)}`;

    if(userMarker){
        userMarker.setLatLng([currentLat, currentLng]);
    } else {
        userMarker = L.marker([currentLat, currentLng], {icon: userIcon})
            .addTo(map)
            .bindPopup("📍 موقعك الحالي الفعلي").openPopup();
    }

    // ميزة تثبيت الكاميرا وتحريك الخريطة مع السائق/المستخدم تلقائياً
    const isAutoCenter = document.getElementById("autoCenterCheck").checked;
    if(isAutoCenter && (targetLat === null || targetLng === null)) {
        map.setView([currentLat, currentLng], 17); // زووم قريب ومناسب للملاحة الحية
    }
}

//////////////////////////////////////
// البحث عن الوجهة (Geocoding)
//////////////////////////////////////
async function searchDestination(){
    let query = document.getElementById("targetInput").value.trim();
    if(!query){
        alert("من فضلك أدخل اسم الوجهة أولاً");
        return;
    }

    try{
        let response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
        let data = await response.json();

        if(data.length === 0){
            alert("تعذر العثور على هذا المكان، يرجى كتابة الاسم بشكل أوضح");
            return;
        }

        targetLat = parseFloat(data[0].lat);
        targetLng = parseFloat(data[0].lon);
        document.getElementById("targetText").innerText = data[0].display_name;

        updateTargetMarker();
        
        // تشغيل الملاحة المباشرة والـ GPS فوراً وبشكل تلقائي بعد تحديد الوجهة
        startLiveTracking();

        if(currentLat !== null && currentLng !== null){
            drawRoute();
        }
    }catch(error){
        console.error(error);
        alert("حدث خطأ في الاتصال بالخادم أثناء البحث");
    }
}

function updateTargetMarker(){
    if(targetMarker){
        targetMarker.setLatLng([targetLat, targetLng]);
    } else {
        targetMarker = L.marker([targetLat, targetLng], {icon: targetIcon})
            .addTo(map)
            .bindPopup("🎯 وجهتك المقصودة");
    }
}

//////////////////////////////////////
// رسم ومتابعة الطريق الملاحي الحقيقي وحساب المسافة بدقة خرائط جوجل
//////////////////////////////////////
function drawRoute(){
    // إذا كان الموجه موجوداً بالفعل، نقوم فقط بتحديث النقاط (Waypoints) لمنع حدوث وميض وإعادة رسم عشوائي للخريطة
    if(routeControl){
        routeControl.setWaypoints([
            L.latLng(currentLat, currentLng),
            L.latLng(targetLat, targetLng)
        ]);
    } else {
        routeControl = L.Routing.control({
            waypoints: [
                L.latLng(currentLat, currentLng),
                L.latLng(targetLat, targetLng)
            ],
            routeWhileDragging: false,
            draggableWaypoints: false,
            addWaypoints: false,
            show: false, // إخفاء جدول التعليمات النصية لتركيز الرؤية على الخريطة والمسافة
            createMarker: function() { return null; }, // الاعتماد على الماركرز المخصصة التي قمنا بتعريفها فوق
            lineOptions: {
                styles: [{ color: '#2563eb', opacity: 0.8, weight: 6 }] // خط ملاحة أزرق عريض وواضح مثل جوجل مابس
            }
        }).addTo(map);

        // حساب المسافة الحقيقية الدقيقة من الخادم بناءً على الشوارع والمنعطفات
        routeControl.on('routesfound', function(e) {
            let routes = e.routes;
            let summary = routes[0].summary;
            updateDistanceDisplay(summary.totalDistance);
        });
    }

    // تحريك الكاميرا تلقائياً لاحتواء خط السير كاملاً وبشكل مريح للعين فقط في حال لم يتم تفعيل التثبيت الصارم على موقع المستخدم
    const isAutoCenter = document.getElementById("autoCenterCheck").checked;
    if(!isAutoCenter) {
        let bounds = L.latLngBounds([[currentLat, currentLng], [targetLat, targetLng]]);
        map.fitBounds(bounds, { padding: [50, 50] });
    } else {
        // إذا كان التثبيت مفعل أثناء وجود وجهة، تتبع موقع المستخدم وتعمل زووم متوسط لعرض الطريق أمامه
        map.setView([currentLat, currentLng], 15);
    }
}

function updateDistanceDisplay(distance){
    if(distance >= 1000){
        document.getElementById("distanceBox").innerText = (distance/1000).toFixed(2) + " كم";
    }else{
        document.getElementById("distanceBox").innerText = Math.round(distance) + " متر";
    }
}

//////////////////////////////////////
// ربط متكامل ومباشر مع تطبيق خرائط جوجل الفعلي للملاحة بالصوت
//////////////////////////////////////
function openGoogleMaps(){
    if(currentLat === null || targetLat === null){
        alert("يجب تشغيل الـ GPS وتحديد وجهتك أولاً لتتمكن من الانتقال لخرائط جوجل");
        return;
    }
    // الرابط المطور الذي يفتح تطبيق خرائط جوجل مباشرة في وضع الملاحة الحية (Turn-by-turn Navigation)
    let url = `https://www.google.com/maps/dir/?api=1&origin=${currentLat},${currentLng}&destination=${targetLat},${targetLng}&travelmode=driving`;
    window.open(url, '_blank');
}

window.onload = initMap;
</script>

</body>
</html>
