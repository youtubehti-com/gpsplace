<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نظام Traking العالمي المستقر</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<!-- Routing Machine CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"/>

<style>
:root{
    --bg:#0f172a;
    --card:rgba(30,41,59,.8);
    --primary:#0d9488;
    --accent:#f59e0b;
    --gps:#2563eb;
    --text:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Tahoma,sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:550px;
    background:var(--card);
    backdrop-filter:blur(10px);
    border-radius:25px;
    padding:20px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
}

h1{
    text-align:center;
    color:var(--primary);
    margin-bottom:15px;
}

.status{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
    font-size:.9rem;
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#f59e0b;
}

.blink{
    animation:blink 1s infinite alternate;
}

@keyframes blink{
    from{opacity:.3;}
    to{opacity:1;}
}

.input-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:6px;
    color:var(--accent);
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#1e293b;
    color:white;
    font-size:1rem;
}

input:focus{
    outline:none;
    border:2px solid var(--primary);
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:14px;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
    margin-top:10px;
}

button:hover{
    transform:translateY(-2px);
}

.gps-btn{
    background:var(--gps);
    color:white;
}

.search-btn{
    background:var(--accent);
    color:#111827;
}

.maps-btn{
    background:var(--primary);
    color:white;
}

.stop-btn{
    background:#ef4444;
    color:white;
}

#map{
    width:100%;
    height:350px;
    margin-top:20px;
    border-radius:18px;
    overflow:hidden;
}

.card{
    background:rgba(15,23,42,.8);
    padding:15px;
    border-radius:18px;
    margin-top:15px;
}

.card h3{
    color:var(--accent);
    margin-bottom:10px;
}

.distance{
    text-align:center;
    font-size:2rem;
    color:#10b981;
    font-weight:bold;
}

.small{
    font-size:.8rem;
    opacity:.8;
    margin-top:5px;
}

.toggle-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    background: #1e293b;
    padding: 10px 15px;
    border-radius: 12px;
}
</style>
</head>

<body>

<div class="container">

<h1>🛰️ المستكشف العالمي الذكي</h1>

<div class="status">
    <div class="dot" id="statusDot"></div>
    <span id="gpsStatus">في انتظار تشغيل GPS أو تحديد وجهة...</span>
</div>

<button class="gps-btn" onclick="startLiveTracking()">
📍 تشغيل التتبع المباشر عالي الدقة GPS
</button>

<div class="toggle-container">
    <span>🔒 تثبيت الشاشة وتتبع حركتي تلقائياً</span>
    <input type="checkbox" id="autoCenterCheck" checked style="width: auto; cursor: pointer;">
</div>

<button class="stop-btn" onclick="stopTracking()">
⛔ إيقاف التتبع
</button>

<div class="input-group">
    <label>الوجهة المطلوبة:</label>
    <input type="text" id="targetInput" placeholder="اكتب المكان أو المدينة واضغط بدء">
</div>

<button class="search-btn" onclick="searchDestination()">
🚀 بدء الملاحة الذكية
</button>

<div id="map"></div>

<div class="card">
    <h3>📌 نقطة الانطلاق</h3>
    <div id="startText">لم يتم تحديد الموقع بعد</div>
</div>

<div class="card">
    <h3>🎯 الوجهة</h3>
    <div id="targetText">لا توجد وجهة حالياً</div>
</div>

<div class="card">
    <h3 style="text-align:center;color:#10b981">
        📏 المسافة المتبقية (عبر الطرقات)
    </h3>

    <div class="distance" id="distanceBox">
        --
    </div>

    <div class="small" style="text-align:center" id="accuracyText">
        يتم تحديثها لحظياً بدقة طبقاً لمسار الشوارع الفعلي
    </div>
</div>

<button class="maps-btn" onclick="openGoogleMaps()">
🗺️ فتح الملاحة في خرائط جوجل
</button>

</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Routing Machine JS -->
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

<script>
let map;
let userMarker;
let targetMarker;
let routeControl;
let watchId = null;

let currentLat = null;
let currentLng = null;
let targetLat = null;
let targetLng = null;

//////////////////////////////////////
// تشغيل الخريطة
//////////////////////////////////////
function initMap(){
    map = L.map('map').setView([26.8206,30.8025], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        maxZoom: 19
    }).addTo(map);
}

//////////////////////////////////////
// تشغيل GPS المباشر عالي الدقة
//////////////////////////////////////
function startLiveTracking(){
    if(!navigator.geolocation){
        alert("المتصفح لا يدعم تحديد الموقع GPS");
        return;
    }

    if(watchId !== null) return;

    document.getElementById("statusDot").className = "dot blink";
    document.getElementById("statusDot").style.background = "#f59e0b";
    document.getElementById("gpsStatus").innerText = "جاري الاتصال بالأقمار الصناعية...";

    const gpsOptions = {
        enableHighAccuracy: true, 
        maximumAge: 0,            
        timeout: 6000             
    };

    watchId = navigator.geolocation.watchPosition(
        function(position){
            // مصفاة لمنع قفزات الموقع الوهمية خارج الشارع
            if (position.coords.accuracy > 40 && currentLat !== null) {
                document.getElementById("accuracyText").innerText = `إشارة ضعيفة (نسبة الخطأ ±${Math.round(position.coords.accuracy)} متر)...`;
                return; 
            }

            currentLat = position.coords.latitude;
            currentLng = position.coords.longitude;

            document.getElementById("statusDot").classList.remove("blink");
            document.getElementById("statusDot").style.background = "#10b981";
            document.getElementById("gpsStatus").innerText = "GPS متصل والتتبع يعمل مباشرة 📡";
            document.getElementById("accuracyText").innerText = `دقة الإشارة الحالية: ±${Math.round(position.coords.accuracy)} متر`;

            updateUserMarker();

            if(targetLat !== null && targetLng !== null){
                drawRoute();
            }
        },
        function(error){
            console.error(error);
            document.getElementById("statusDot").style.background = "#ef4444";
            document.getElementById("statusDot").classList.remove("blink");
            document.getElementById("gpsStatus").innerText = "فشل الوصول للموقع";
            alert("تأكد من تفعيل صلاحيات الموقع وتشغيل الـ GPS على جهازك.");
        },
        gpsOptions
    );
}

function stopTracking(){
    if(watchId !== null){
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        document.getElementById("gpsStatus").innerText = "تم إيقاف التتبع";
        document.getElementById("statusDot").style.background = "#f59e0b";
        document.getElementById("statusDot").classList.remove("blink");
    }
}

//////////////////////////////////////
// تحديث ماركر المستخدم
//////////////////////////////////////
function updateUserMarker(){
    document.getElementById("startText").innerText = `الموقع الحالي:\n${currentLat.toFixed(5)}, ${currentLng.toFixed(5)}`;

    if(userMarker){
        userMarker.setLatLng([currentLat, currentLng]);
    }else{
        userMarker = L.marker([currentLat, currentLng])
            .addTo(map)
            .bindPopup("📍 موقعك الحالي الفعلي").openPopup();
    }

    const isAutoCenter = document.getElementById("autoCenterCheck").checked;
    if(isAutoCenter && (targetLat === null || targetLng === null)) {
        map.setView([currentLat, currentLng], 16);
    }
}

//////////////////////////////////////
// البحث عن الوجهة
//////////////////////////////////////
async function searchDestination(){
    let query = document.getElementById("targetInput").value.trim();

    if(!query){
        alert("اكتب اسم الوجهة أولاً");
        return;
    }

    try{
        let response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
        let data = await response.json();

        if(data.length === 0){
            alert("لم يتم العثور على المكان، اكتبه بشكل أوضح");
            return;
        }

        targetLat = parseFloat(data[0].lat);
        targetLng = parseFloat(data[0].lon);
        document.getElementById("targetText").innerText = data[0].display_name;

        updateTargetMarker();
        startLiveTracking(); 

        if(currentLat !== null && currentLng !== null){
            drawRoute();
        }
    }catch(error){
        console.error(error);
        alert("حدث خطأ أثناء البحث");
    }
}

function updateTargetMarker(){
    if(targetMarker){
        targetMarker.setLatLng([targetLat, targetLng]);
    }else{
        targetMarker = L.marker([targetLat, targetLng])
            .addTo(map)
            .bindPopup("🎯 الوجهة");
    }
}

//////////////////////////////////////
// حساب المسار والمسافة
//////////////////////////////////////
function drawRoute(){
    if(routeControl){
        routeControl.setWaypoints([
            L.latLng(currentLat, currentLng),
            L.latLng(targetLat, targetLng)
        ]);
    } else {
        routeControl = L.Routing.control({
            waypoints:[
                L.latLng(currentLat, currentLng),
                L.latLng(targetLat, targetLng)
            ],
            routeWhileDragging: false,
            draggableWaypoints: false,
            addWaypoints: false,
            show: false,
            createMarker: function() { return null; },
            lineOptions: {
                styles: [{ color: '#2563eb', opacity: 0.8, weight: 6 }]
            }
        }).addTo(map);

        routeControl.on('routesfound', function(e) {
            let routes = e.routes;
            let summary = routes[0].summary;
            updateDistanceDisplay(summary.totalDistance);
        });
    }

    const isAutoCenter = document.getElementById("autoCenterCheck").checked;
    if(!isAutoCenter) {
        let bounds = L.latLngBounds([[currentLat, currentLng], [targetLat, targetLng]]);
        map.fitBounds(bounds, { padding: [50, 50] });
    } else {
        map.setView([currentLat, currentLng], 15);
    }
}

function updateDistanceDisplay(distance){
    if(distance >= 1000){
        document.getElementById("distanceBox").innerText = (distance/1000).toFixed(2) + " كم";
    }else{
        document.getElementById("distanceBox").innerText = Math.round(distance) + " متر";
    }
}

function openGoogleMaps(){
    if(currentLat === null || targetLat === null){
        alert("حدد الوجهة وشغّل الـ GPS أولاً");
        return;
    }
    let url = `https://www.google.com/maps/dir/?api=1&origin=${currentLat},${currentLng}&destination=${targetLat},${targetLng}&travelmode=driving`;
    window.open(url, '_blank');
}

window.onload = initMap;
</script>
</body>
</html>
