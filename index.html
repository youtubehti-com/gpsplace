<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد الذكي للملاحة الاحترافية</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        :root{ --bg:#0f172a; --card:rgba(30,41,59,.9); --primary:#0d9488; --accent:#f59e0b; --gps:#2563eb; --text:#f8fafc; --danger:#ef4444; --success:#10b981; --lost:#8b5cf6; }
        body{ background:var(--bg); color:var(--text); font-family:'Segoe UI', sans-serif; display:flex; justify-content:center; padding:20px; }
        .container{ width:100%; max-width:600px; background:var(--card); backdrop-filter:blur(15px); border-radius:30px; padding:25px; box-shadow:0 25px 50px rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,0.1); }
        h1{ text-align:center; color:var(--primary); margin-bottom:20px; font-size:1.5rem; }
        input, select, button{ width:100%; padding:14px; border-radius:15px; border:none; margin-bottom:10px; font-size:1rem; }
        input, select{ background:#1e293b; color:white; border:1px solid #334155; }
        button{ cursor:pointer; font-weight:bold; transition:0.3s; }
        button:hover{ filter:brightness(1.2); transform:scale(1.02); }
        .btn-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .map-box{ height:350px; border-radius:20px; overflow:hidden; border:2px solid #334155; margin:20px 0; }
        .distance-display{ text-align:center; padding:20px; background:linear-gradient(145deg, #1e293b, #0f172a); border-radius:20px; border:1px solid var(--primary); }
        .distance-val{ font-size:2rem; color:var(--success); font-weight:bold; }
        .lost-section{ background:rgba(139,92,246,0.1); border:1px solid var(--lost); padding:20px; border-radius:20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛰️ الملاح الذكي للمساعدة</h1>
        
        <div class="btn-grid">
            <button style="background:var(--gps); color:white;" onclick="startLiveTracking()">📍 تفعيل GPS الحي</button>
            <button style="background:var(--danger); color:white;" onclick="stopTracking()">⛔ إيقاف التتبع</button>
        </div>

        <div class="lost-section">
            <label>تحديد/حفظ موقع البدء (المرجع):</label>
            <input type="text" id="manualStartInput" placeholder="خط العرض, خط الطول (اختياري)">
            <div class="btn-grid">
                <button style="background:#475569; color:white;" onclick="saveCurrentLocation()">💾 حفظ موقعي الحالي</button>
                <button style="background:var(--lost); color:white;" onclick="returnToStartLocation()">🔄 العودة للبداية</button>
            </div>
            <label>مسافة التنبيه بالصوت (متر):</label>
            <input type="number" id="fenceDistance" value="50" placeholder="أدخل المسافة بالأمتار">
        </div>

        <div class="map-box" id="map"></div>

        <div class="distance-display">
            <div class="distance-val" id="distanceBox">0 متر</div>
            <p id="directionText" style="color:var(--accent); margin-top:10px;"></p>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, userMarker, watchId, savedStartLat, savedStartLng;
        
        function initMap(){ map = L.map('map').setView([0,0], 2); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); }
        
        function speak(text) {
            window.speechSynthesis.cancel();
            let msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'ar-SA';
            window.speechSynthesis.speak(msg);
        }

        function startLiveTracking(){
            watchId = navigator.geolocation.watchPosition(pos => {
                let {latitude, longitude} = pos.coords;
                if(!userMarker) userMarker = L.marker([latitude, longitude]).addTo(map).bindPopup("أنت هنا").openPopup();
                else userMarker.setLatLng([latitude, longitude]);
                map.setView([latitude, longitude], 16);
                
                if(savedStartLat) checkDistance(latitude, longitude);
            }, null, {enableHighAccuracy: true});
        }

        function saveCurrentLocation() {
            navigator.geolocation.getCurrentPosition(pos => {
                savedStartLat = pos.coords.latitude;
                savedStartLng = pos.coords.longitude;
                speak("تم حفظ الموقع الحالي كبداية بنجاح.");
            });
        }

        function checkDistance(lat, lng) {
            let threshold = document.getElementById("fenceDistance").value || 50;
            let dist = getDistance(lat, lng, savedStartLat, savedStartLng);
            document.getElementById("distanceBox").innerText = Math.round(dist) + " متر";
            
            if(dist > threshold) {
                let dir = getDirection(lat, lng, savedStartLat, savedStartLng);
                document.getElementById("directionText").innerText = "اتجه نحو: " + dir;
                speak("تحذير، أنت مبتعد عن نقطة البداية. اتجه نحو " + dir);
            }
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            let dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
            let a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function getDirection(lat1, lon1, lat2, lon2) {
            let y = Math.sin(lon2-lon1) * Math.cos(lat2);
            let x = Math.cos(lat1)*Math.sin(lat2) - Math.sin(lat1)*Math.cos(lat2)*Math.cos(lon2-lon1);
            let brng = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
            if(brng < 22.5 || brng >= 337.5) return "الشمال";
            if(brng < 67.5) return "الشمال الشرقي";
            if(brng < 112.5) return "الشرق";
            if(brng < 157.5) return "الجنوب الشرقي";
            if(brng < 202.5) return "الجنوب";
            if(brng < 247.5) return "الجنوب الغربي";
            if(brng < 292.5) return "الغرب";
            return "الشمال الغربي";
        }

        function stopTracking(){ navigator.geolocation.clearWatch(watchId); speak("تم إيقاف التتبع."); }
        window.onload = initMap;
    </script>
</body>
</html>
